# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: scripts/audit.sh  (or `cargo deny check`)
[graph]
all-features = true

[advisories]
# RustSec database; yanked crates and unmaintained/unsound notices fail the check
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# permissive licenses only (the workspace crates are MIT OR Apache-2.0 and unpublished: `private.ignore`)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# two versions of one crate is common (windows-*, syn, ...): visible, not fatal
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
