[workspace]
resolver = "2"
members = ["aix-core", "aix-extract", "aix-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
regex = "=1.13.1"
sha1_smol = "=1.0.1"
sha2 = "=0.10.9"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
hmac = "=0.12.1"
toml = "=1.1.8"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive", "env"] }
ignore = "=0.4.33"
rayon = "=1.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions", "trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tree-sitter = "=0.27.1"
tree-sitter-typescript = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-python = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.25.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-swift = "=0.7.4"
tree-sitter-scala = "=0.26.3"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-dart = "=0.2.0"
tree-sitter-lua = "=0.5.0"
ureq = { version = "=3.5.0", features = ["json"] }
rmcp = { version = "=3.6.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "io-std", "io-util", "time"] }
schemars = "=1.2.3"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
